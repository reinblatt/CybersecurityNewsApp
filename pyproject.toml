[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-news-app"
version = "0.1.0"
description = "Fetch and format cybersecurity RSS feeds for NotebookLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cybernews = "cli:main"

[tool.setuptools]
py-modules = ["cli", "feed_fetcher", "formatter", "parser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
